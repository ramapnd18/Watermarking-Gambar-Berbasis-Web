<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uji Serangan Watermarking DCT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="bg-slate-900 text-white px-6 py-4">
  <h1 class="text-xl font-bold">Uji Serangan Watermarking DCT</h1>
  <p class="text-sm text-slate-300">Unggah citra &rarr; serang &rarr; lihat PSNR. Tahap sisip/ekstrak watermark menyusul.</p>
</header>

<main class="max-w-6xl mx-auto p-6 space-y-6">

  <!-- Unggah -->
  <section class="bg-white rounded shadow p-4">
    <h2 class="font-semibold mb-2">1. Unggah Citra</h2>
    <div class="flex flex-wrap items-center gap-3">
      <input id="masukan-berkas" type="file" accept="image/*"
             class="text-sm file:mr-3 file:px-3 file:py-1 file:rounded file:border-0 file:bg-slate-900 file:text-white">
      <button id="tombol-semua" class="px-4 py-1 rounded bg-emerald-600 text-white text-sm disabled:opacity-40" disabled>
        Jalankan Semua Serangan
      </button>
      <span id="status" class="text-sm text-slate-500">Belum ada citra.</span>
    </div>
    <div class="mt-3">
      <p class="text-sm font-medium mb-1">Citra asli:</p>
      <img id="pratinjau-asli" class="max-h-64 rounded border hidden" alt="Citra asli">
    </div>
  </section>

  <!-- Tombol serangan satuan -->
  <section class="bg-white rounded shadow p-4">
    <h2 class="font-semibold mb-2">2. Serangan Satuan</h2>
    <div class="flex flex-wrap gap-2 text-sm">
      <button data-serang="jpeg-90" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>JPEG 90</button>
      <button data-serang="jpeg-70" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>JPEG 70</button>
      <button data-serang="jpeg-50" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>JPEG 50</button>
      <button data-serang="noise" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>Noise</button>
      <button data-serang="crop" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>Crop 20%</button>
      <button data-serang="resize" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>Resize</button>
      <button data-serang="kontras" class="btn-serang px-3 py-1 rounded bg-slate-700 text-white disabled:opacity-40" disabled>Kontras</button>
      <button data-serang="gabungan" class="btn-serang px-3 py-1 rounded bg-red-700 text-white disabled:opacity-40" disabled>Gabungan Q50+Noise+Crop</button>
    </div>
  </section>

  <!-- Hasil -->
  <section class="bg-white rounded shadow p-4">
    <h2 class="font-semibold mb-2">3. Hasil &amp; PSNR</h2>
    <div id="hasil" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <p class="text-sm text-slate-400 col-span-full">Hasil serangan tampil di sini beserta skor PSNR (dB).</p>
    </div>
  </section>

</main>

<script>
// State lokal: berkas asli dipakai ulang untuk tiap serangan (tanpa reload).
let berkasAsli = null;

const masukanBerkas = document.getElementById("masukan-berkas");
const pratinjauAsli = document.getElementById("pratinjau-asli");
const tombolSemua = document.getElementById("tombol-semua");
const statusEl = document.getElementById("status");
const wadahHasil = document.getElementById("hasil");
const tombolSerang = document.querySelectorAll(".btn-serang");

masukanBerkas.addEventListener("change", () => {
  berkasAsli = masukanBerkas.files[0] || null;
  const aktif = !!berkasAsli;
  tombolSemua.disabled = !aktif;
  tombolSerang.forEach(t => t.disabled = !aktif);
  wadahHasil.innerHTML = "";
  if (aktif) {
    pratinjauAsli.src = URL.createObjectURL(berkasAsli);
    pratinjauAsli.classList.remove("hidden");
    statusEl.textContent = "Siap: " + berkasAsli.name;
  } else {
    pratinjauAsli.classList.add("hidden");
    statusEl.textContent = "Belum ada citra.";
  }
});

function kartuHasil(nama, psnr, base64) {
  const teksPsnr = (psnr === "inf") ? "inf (identik)" : Number(psnr).toFixed(2) + " dB";
  const div = document.createElement("div");
  div.className = "border rounded p-2 bg-slate-50";
  div.innerHTML =
    '<p class="text-sm font-semibold">' + nama + '</p>' +
    '<p class="text-sm text-emerald-700 font-mono">PSNR: ' + teksPsnr + '</p>' +
    '<img class="mt-1 max-h-48 rounded border" src="data:image/png;base64,' + base64 + '" alt="' + nama + '">';
  return div;
}

async function kirim(url, formData) {
  const respon = await fetch(url, { method: "POST", body: formData });
  const data = await respon.json();
  if (!respon.ok) throw new Error(data.galat || ("HTTP " + respon.status));
  return data;
}

function butuhBerkas() {
  if (!berkasAsli) { statusEl.textContent = "Unggah citra dulu."; return null; }
  const fd = new FormData();
  fd.append("berkas", berkasAsli);
  return fd;
}

tombolSerang.forEach(tombol => {
  tombol.addEventListener("click", async () => {
    const fd = butuhBerkas();
    if (!fd) return;
    const jenis = tombol.dataset.serang;
    statusEl.textContent = "Menyerang: " + jenis + " …";
    try {
      let data;
      if (jenis.startsWith("jpeg-")) {
        fd.append("kualitas", jenis.split("-")[1]);
        data = await kirim("/api/attack/jpeg", fd);
      } else {
        fd.append("jenis", jenis);
        data = await kirim("/api/attack/manipulation", fd);
      }
      wadahHasil.prepend(kartuHasil(data.nama, data.psnr, data.citra_base64));
      statusEl.textContent = "Selesai: " + data.nama;
    } catch (e) {
      statusEl.textContent = "Gagal: " + e.message;
    }
  });
});

tombolSemua.addEventListener("click", async () => {
  const fd = butuhBerkas();
  if (!fd) return;
  statusEl.textContent = "Menjalankan semua serangan …";
  wadahHasil.innerHTML = "";
  try {
    const data = await kirim("/api/attack/semua", fd);
    data.hasil.forEach(h => wadahHasil.appendChild(kartuHasil(h.nama, h.psnr, h.citra_base64)));
    statusEl.textContent = "Selesai: " + data.hasil.length + " serangan.";
  } catch (e) {
    statusEl.textContent = "Gagal: " + e.message;
  }
});
</script>
</body>
</html>
